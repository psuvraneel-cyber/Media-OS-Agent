<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://127.0.0.1:* http://localhost:*; img-src 'self' data:"
    />
    <title>Media OS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, rgba(6, 8, 12, 0.1), rgba(6, 8, 12, 0.22));
        color: #eceef2;
      }
      /* Window drag area where the title bar would be (the caption buttons sit on the right). */
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 56px;
        -webkit-app-region: drag;
      }
      main {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: min(440px, 100%);
        padding: 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 24px 48px -16px rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      .logo {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        filter: drop-shadow(0 12px 28px rgba(37, 99, 235, 0.6));
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: #a3a9b6;
      }
      code {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 6px;
        border-radius: 5px;
      }
      .status {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #67e8f9;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22d3ee;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.9);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
      button {
        margin-top: 20px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #04121a;
        background: linear-gradient(180deg, #67e8f9, #22d3ee);
        border: 0;
        border-radius: 8px;
        padding: 8px 18px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .detail {
        margin-top: 16px;
        font-size: 11px;
        color: #6c7282;
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <div class="card" role="status" aria-live="polite">
        <img class="logo" src="assets/icon.png" alt="" aria-hidden="true" />
        <h1>Media OS isn't reachable yet</h1>
        <p>
          The dashboard runs in your local Media OS stack. Start <strong>Docker Desktop</strong> and the
          Media OS containers, and this window opens the dashboard automatically.
        </p>
        <div class="status"><span class="dot" aria-hidden="true"></span><span id="status">Checking…</span></div>
        <div><button id="retry" type="button">Try again now</button></div>
        <p class="detail">Looking for <code id="target"></code></p>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get("target") || "";
        var target;
        try {
          target = new URL(raw);
        } catch (e) {
          target = null;
        }
        // Only ever return to a local Media OS address.
        var ok =
          target &&
          target.protocol === "http:" &&
          (target.hostname === "127.0.0.1" || target.hostname === "localhost");
        var statusEl = document.getElementById("status");
        document.getElementById("target").textContent = ok ? target.origin : "(invalid address)";
        if (!ok) {
          statusEl.textContent = "Invalid address";
          return;
        }

        var attempts = 0;
        var timer = null;

        function probe() {
          attempts += 1;
          statusEl.textContent = attempts === 1 ? "Checking…" : "Still waiting · retrying every 5 s";
          // Opaque (no-cors) request: resolves if anything answers, rejects if nothing is listening.
          fetch(target.origin + "/api/health", { mode: "no-cors", cache: "no-store" })
            .then(function () {
              statusEl.textContent = "Found it, opening…";
              window.location.replace(target.href);
            })
            .catch(function () {
              timer = window.setTimeout(probe, 5000);
            });
        }

        document.getElementById("retry").addEventListener("click", function () {
          window.clearTimeout(timer);
          probe();
        });
        probe();
      })();
    </script>
  </body>
</html>
